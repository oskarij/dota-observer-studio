appId: com.observerstudio.app
productName: Observer Studio

# Only the compiled output and runtime deps ship; src/, .svelte-kit/, tsconfig, etc. are excluded.
# electron-builder still bundles production node_modules automatically (electron-store, font-list).
files:
  - build/electron/**/*
  - build/web/**/*
  - build/overlay-assets/**/*
  - package.json

directories:
  output: release

win:
  # zip = a folder with Observer Studio.exe + resources, compressed. Extract and run, no installer.
  target:
    - zip
  # logo.png is 263x263 (>=256); electron-builder generates the multi-size exe icon from it.
  # (icon.ico is only 32x32 and is still used for the in-app window icon at runtime.)
  icon: static/logo.png
  # Code signing is optional. To sign, drop the cert here (or set CSC_LINK / CSC_KEY_PASSWORD env vars):
  # certificateFile: path/to/cert.pfx
  # certificatePassword: ...
