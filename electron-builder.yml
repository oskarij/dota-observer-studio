appId: io.github.oskarij.observerstudio
productName: Observer Studio

# Production node_modules are added automatically.
files:
  - build/electron/**/*
  - build/web/**/*
  # The studio preview uses still posters; only the overlay host serves the videos.
  - '!build/web/**/*.webm'
  - build/overlay-assets/**/*
  - package.json

# Shipped beside the executable.
extraFiles:
  - README.md
  - LICENSE
  - docs/custom-styling.md

directories:
  output: release

artifactName: ${productName}-${version}-win-x64.${ext}

win:
  target:
    - zip
  # The exe icon needs at least 256x256; static/icon.ico (32x32) is only the window icon.
  icon: static/logo.png
  # Exe metadata only: the build is unsigned.
  publisherName: oskarij
  # To sign, set certificateFile and certificatePassword, or CSC_LINK and CSC_KEY_PASSWORD.
