<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <!-- The overlay loads only its own bundle and connects to /events on its own serving origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'"
    />
    <title>Dota Spectator Overlay</title>
  </head>
  <body>
    <main class="overlay-root" id="overlay-root"></main>

    <script src="./overlay.ts" type="module"></script>
  </body>
</html>
