name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      # The checks never launch Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # No LFS: the checks do not read the hero videos, and every LFS download counts against the
      # repository's bandwidth quota.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
